<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayCalc</title>
    <style>
        /* Root styles for both themes */
        :root {
            --background-color-light: #ffffff;
            --text-color-light: #333333;
            --primary-color-light: #4CAF50;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --gradient-light: linear-gradient(to bottom, #ffffff, #f1f1f1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color-dark: #121212;
                --text-color-dark: #f1f1f1;
                --primary-color-dark: #5EBA7F;
                --shadow-dark: rgba(0, 0, 0, 0.7);
                --gradient-dark: linear-gradient(to bottom, #121212, #1d1d1d);
            }
        }

        body {
            background-color: var(--background-color-light);
            color: var(--text-color-light);
            transition: background-color 0.5s, color 0.5s;
            background-image: var(--gradient-light);
            box-shadow: 0 4px 10px var(--shadow-light);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--background-color-dark);
                color: var(--text-color-dark);
                background-image: var(--gradient-dark);
                box-shadow: 0 4px 10px var(--shadow-dark);
            }
        }

        h1 {
            color: var(--primary-color-light);
        }

        @media (prefers-color-scheme: dark) {
            h1 {
                color: var(--primary-color-dark);
            }
        }

    </style>
</head>
<body>
    <h1>Welcome to PayCalc</h1>
    <p>Use this calculator to pay your bills easily.</p>
    <!-- Add your calculator structure here -->
</body>
</html>
